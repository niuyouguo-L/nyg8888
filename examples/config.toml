# probe-kit 配置示例
# 复制成 config.toml 后按需改（config.toml 已在 .gitignore 里，避免把 webhook 密钥提交上去）

[notify]
# 三个渠道任选，都不填就只打印到终端
# webhook    = "https://your-endpoint/hook"
# serverchan = "SCT..."
# pushplus   = ""

# 全局默认超时（秒），单个 target 可以用自己的 timeout 覆盖
timeout = 10

[[targets]]
name = "example-200"
url  = "https://httpbin.org/status/200"
expect_status = 200
max_ms = 5000

[[targets]]
name = "example-json"
url  = "https://httpbin.org/json"
expect_status = "2xx"
watch_content = true          # 响应体 sha256 变了就告警

[[targets]]
name = "example-keyword"
url  = "https://httpbin.org/anything"
expect_keyword = "anything"
timeout = 15
